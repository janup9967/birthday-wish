<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday Neha</title>
    <link rel="stylesheet" href="Birthday.css" />
  </head>
  <body>
    <canvas id="c"></canvas>

    <!-- Interactive Floating Letter (click 1→move, click 2→move, click 3→open) -->
    <div id="fl-letter" title="Click me...">💌</div>

    <!-- Romantic Message Overlay (revealed on 3rd click) -->
    <div id="fl-overlay">
      <div id="fl-card">
        <div class="fl-hearts">💖 💗 💖</div>
        <h1 class="fl-title">Happy Birthday</h1>
        <p class="fl-msg">
          You bring so much happiness<br>
          and positivity into my life.<br>
          Every day feels brighter with you around.<br><br>
          <span class="fl-sub">Forever grateful for your friendship & support 💕</span>
        </p>
        <div class="fl-hearts">🌹 ✨ 🌹</div>
        <button id="fl-close">Close ✕</button>
      </div>
    </div>

    <script src="Birthday.js"></script>
  </body>
</html>
